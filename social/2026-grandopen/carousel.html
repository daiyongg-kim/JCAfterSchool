<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>NEW OWNERSHIP · GRAND OPEN — 정철 JC 애프터스쿨 인스타그램 캐러셀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--cream:#FBF8F3;--cream2:#F4EEE4;--navy:#1C2A3A;--red:#D6402F;--amber:#E8A33D;--muted:#675F57;--line:#E7DFD3}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:var(--cream);
  font-family:Pretendard,-apple-system,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1440px;overflow:hidden;padding:92px}
.brand{display:flex;align-items:center;gap:16px;font-size:27px;font-weight:800}
.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:10px;background:var(--red);color:#fff;font-size:22px;font-weight:900}
.num{position:absolute;right:92px;top:103px;font-size:23px;font-weight:800;color:var(--muted)}
.eyebrow{font-size:28px;font-weight:900;color:var(--red);letter-spacing:.05em;margin-top:104px}
.title{font-size:88px;line-height:1.1;letter-spacing:-.05em;margin:22px 0 30px;font-weight:900}
.title.sm{font-size:74px}
.lead{font-size:33px;line-height:1.5;font-weight:650;color:#2b3a4a}
.dots{position:absolute;right:92px;bottom:82px;display:flex;gap:10px}
.dots i{width:11px;height:11px;border-radius:50%;background:#c9bfb2}
.dots i.on{width:34px;border-radius:8px;background:var(--red)}
.swipe{position:absolute;left:92px;bottom:78px;font-size:25px;font-weight:800;color:var(--red)}

.dark{background:var(--navy);color:#fff}
.dark .num{color:#8fa0b2}.dark .eyebrow{color:var(--amber)}.dark .lead{color:#DCE3E9}
.dark .dots i{background:#4a5a6b}.dark .dots i.on{background:var(--amber)}
.dark .swipe{color:var(--amber)}

.photo{padding:0}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,42,58,.62) 0%,rgba(28,42,58,.06) 38%,rgba(28,42,58,.30) 62%,rgba(28,42,58,.88) 100%)}
.photo .top{position:absolute;left:92px;right:92px;top:103px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.photo .top .brand{color:#fff}
.photo .cap{position:absolute;left:92px;right:92px;bottom:150px;color:#fff}
.photo .cap .eyebrow{margin:0 0 18px;color:var(--amber)}
.photo .cap .title{font-size:76px;margin:0;text-shadow:0 6px 40px rgba(0,0,0,.45)}
.photo .dots i{background:rgba(255,255,255,.45)}
.photo .dots i.on{background:#fff}

.facts{display:grid;gap:26px;margin-top:52px}
.fact{display:flex;gap:26px;align-items:flex-start;padding:34px 36px;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 16px 38px rgba(28,42,58,.08)}
.fact .ic{display:grid;place-items:center;flex:none;width:74px;height:74px;border-radius:50%;background:var(--cream2);font-size:36px}
.fact strong{display:block;font-size:34px;line-height:1.25}
.fact p{margin:8px 0 0;font-size:24px;line-height:1.45;color:var(--muted);font-weight:600}
.alert{margin-top:32px;padding:28px 32px;border-left:8px solid var(--red);border-radius:12px;background:#FDEFEC;color:#7a2418;font-size:25px;font-weight:750;line-height:1.45}

.steps{counter-reset:s;display:grid;gap:22px;margin-top:48px}
.step{counter-increment:s;position:relative;padding:30px 36px 30px 108px;background:#fff;border:2px solid var(--line);border-radius:18px}
.step::before{content:counter(s);position:absolute;left:36px;top:30px;width:50px;height:50px;border-radius:12px;background:var(--red);color:#fff;font-size:26px;font-weight:900;display:grid;place-items:center}
.step strong{display:block;font-size:33px;line-height:1.25}
.step p{margin:8px 0 0;font-size:24px;color:var(--muted);font-weight:600;line-height:1.45}

/* grand-open promo cards */
.offers{display:grid;gap:28px;margin-top:56px}
.offer-card{position:relative;padding:44px 48px;border-radius:22px;background:#fff;border:3px solid var(--red);box-shadow:0 22px 48px rgba(214,64,47,.16)}
.offer-card .tag{display:inline-block;background:var(--red);color:#fff;font-size:22px;font-weight:900;letter-spacing:.08em;padding:10px 18px;border-radius:999px;margin-bottom:20px}
.offer-card strong{display:block;font-size:58px;line-height:1.15;letter-spacing:-.03em}
.offer-card p{margin:12px 0 0;font-size:26px;color:var(--muted);font-weight:650}
.offer-card.amber{border-color:var(--amber);box-shadow:0 22px 48px rgba(232,163,61,.20)}
.offer-card.amber .tag{background:var(--amber);color:#3a2a10}

/* info rows */
.rows{display:grid;gap:20px;margin-top:52px}
.row{display:flex;align-items:center;gap:28px;padding:30px 36px;background:#fff;border:2px solid var(--line);border-radius:16px}
.row .k{flex:none;width:190px;font-size:25px;font-weight:900;color:var(--red);letter-spacing:.02em}
.row .v{font-size:31px;font-weight:750;line-height:1.3}

.contact{margin-top:56px;background:#fff;color:var(--navy);border-radius:20px;padding:44px 48px;display:grid;gap:26px}
.contact div{font-size:31px;font-weight:850;overflow-wrap:anywhere}
.contact span{display:block;font-size:20px;color:var(--red);letter-spacing:.09em;margin-bottom:4px}
.location{position:absolute;left:92px;bottom:140px;color:#bfc8d2;font-size:22px}
.offer{display:inline-block;margin-top:26px;background:var(--red);color:#fff;padding:22px 34px;border-radius:14px;font-size:32px;font-weight:900;box-shadow:0 18px 36px rgba(214,64,47,.45)}
.ribbon{display:inline-flex;align-items:center;gap:14px;margin-top:96px;padding:16px 28px;border:2px solid var(--amber);border-radius:999px;font-size:26px;font-weight:900;color:var(--amber);letter-spacing:.14em}
</style></head><body><main id="app"></main>
<script>
const N=8;
const slide=Number(new URLSearchParams(location.search).get('slide')||1);
const brand=`<div class="brand"><span class="mark">JC</span>정철 JC 애프터스쿨</div>`;
const num=`<div class="num">${slide} / ${N}</div>`;
const dots=`<div class="dots">${Array.from({length:N},(_,i)=>`<i class="${i+1===slide?'on':''}"></i>`).join('')}</div>`;
const IMG='../../web/blog/img/';

const photo=(src,eyebrow,title)=>`<section class="slide photo">
  <img src="${IMG}${src}"><div class="scrim"></div>
  <div class="top">${brand}<div style="font-size:23px;font-weight:800;opacity:.85">${slide} / ${N}</div></div>
  <div class="cap"><div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1></div>
  ${dots}</section>`;

const slides={
1:`<section class="slide dark">${brand}${num}
  <div class="ribbon">✨ NEW OWNERSHIP</div>
  <h1 class="title" style="margin-top:26px">GRAND<br>OPEN</h1>
  <p class="lead">새로운 오너십과 함께 다시 시작합니다.<br>더 따뜻하게, 더 세심하게 — 아이 한 명 한 명의<br>성장과 배움을 함께하겠습니다. 💕</p>
  <div class="offer" style="margin-top:52px">등록비 100% 면제 · 첫 달 50% 할인</div>
  <div class="location" style="color:#8fa0b2;bottom:230px">Kinder ~ Grade 7 · 소수정예 · 9월 새학기 접수 중</div>
  <div class="swipe">넘겨서 프로모션 보기 →</div>${dots}</section>`,

2:photo('fall-2026-snack-plate.jpg','코퀴틀람 방과후 · KINDER ~ G7','더 따뜻하게,<br>더 세심하게'),

3:`<section class="slide">${brand}${num}
  <div class="eyebrow">🎉 그랜드 오픈 특별 프로모션</div>
  <h1 class="title sm" style="margin-bottom:0">지금 등록하시면</h1>
  <div class="offers">
    <div class="offer-card"><span class="tag">REGISTRATION</span>
      <strong>등록비 100% 면제</strong>
      <p>신규 등록비 전액 면제로 시작합니다.</p></div>
    <div class="offer-card amber"><span class="tag">FIRST MONTH</span>
      <strong>첫 달 교육비 50% 할인</strong>
      <p>첫 한 달을 부담 없이 경험해 보세요.</p></div>
  </div>
  <div class="alert">⚠️ 소수정예 운영으로 스팟이 한정되어 있습니다.</div>${dots}</section>`,

4:`<section class="slide">${brand}${num}
  <div class="eyebrow">📌 하루가 이렇게 이어집니다</div>
  <h1 class="title sm">픽업부터<br>학습까지</h1>
  <div class="steps">
    <div class="step"><strong>🚌 픽업</strong><p>학교 문 앞에서 선생님이 직접 아이를 데리고 옵니다.</p></div>
    <div class="step"><strong>🍪 간식</strong><p>매일 따뜻하게, 땅콩·견과류 없이 안전하게. 별도 비용 없습니다.</p></div>
    <div class="step"><strong>🏠 돌봄</strong><p>부모님 퇴근까지 언제나 선생님과 함께 있습니다.</p></div>
    <div class="step"><strong>📈 학습</strong><p>수학 · 과학 · 영어, 숙제부터 차근차근 봐드립니다.</p></div>
  </div>${dots}</section>`,

5:photo('fall-2026-study-duo.jpg','학습 / STUDY','돌봄만 하는<br>방과후가<br>아닙니다'),

6:`<section class="slide dark">${brand}${num}
  <div class="eyebrow">왜 다른가요</div>
  <h1 class="title">안전하고<br>즐겁게 머물며,<br>실력까지</h1>
  <p class="lead">아이가 하루를 편안하게 보내는 것이 먼저입니다.<br>그 위에 숙제 습관과 수학 · 과학 · 영어 실력,<br>그리고 자신감이 쌓입니다. 🌈</p>${dots}</section>`,

7:`<section class="slide">${brand}${num}
  <div class="eyebrow">📋 운영 안내</div>
  <h1 class="title sm">이렇게<br>운영합니다</h1>
  <div class="rows">
    <div class="row"><div class="k">대상</div><div class="v">Kinder ~ Grade 7</div></div>
    <div class="row"><div class="k">정원</div><div class="v">소수정예 · 한 명 한 명 세심하게</div></div>
    <div class="row"><div class="k">차량</div><div class="v">5대 운행</div></div>
    <div class="row"><div class="k">픽업</div><div class="v">Tri-City · Burnaby · Surrey 전 지역</div></div>
    <div class="row"><div class="k">등록</div><div class="v">9월 새학기 접수 중</div></div>
  </div>${dots}</section>`,

8:`<section class="slide dark">${brand}${num}
  <div class="eyebrow">🧡 먼저 하루, 무료 체험</div>
  <h1 class="title sm">설명보다<br>하루가<br>정확합니다</h1>
  <p class="lead">픽업부터 간식 · 숙제 · 학습까지<br>실제 하루를 그대로 경험해 보세요.</p>
  <div class="offer">무료 체험 하루 · 등록비 면제</div>
  <div class="contact">
    <div><span>카카오톡 / KAKAO</span>프로필 링크 · DM</div>
    <div><span>전화 / PHONE</span>778-258-2223</div>
  </div>
  <div class="location">#130 – 1140 Austin Ave, Coquitlam, BC</div>${dots}</section>`
};
document.getElementById('app').innerHTML=slides[slide];
</script></body></html>
