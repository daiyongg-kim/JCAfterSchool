<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 여름캠프 2차 인스타그램 캐러셀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--cream:#fbf8f3;--navy:#1c2a3a;--red:#d6402f;--amber:#e8a33d;--teal:#20aaa8;--muted:#675f57}*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--cream);font-family:Pretendard,-apple-system,sans-serif;color:var(--navy)}.slide{position:relative;width:1080px;height:1350px;overflow:hidden;padding:88px}.brand{display:flex;align-items:center;gap:16px;font-size:25px;font-weight:800}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:10px;background:var(--red);color:#fff;font-size:20px}.num{position:absolute;right:88px;top:99px;font-size:22px;font-weight:800;color:var(--muted)}.eyebrow{font-size:27px;font-weight:900;color:var(--red);letter-spacing:.03em;margin-top:120px}.title{font-size:82px;line-height:1.08;letter-spacing:-.055em;margin:16px 0 28px;font-weight:900}.lead{font-size:31px;line-height:1.55;font-weight:650}.cover{background:url('cover-background.png') center/cover no-repeat}.cover .title{font-size:94px;margin-top:24px}.cover .date{display:inline-block;margin-top:32px;background:var(--navy);color:#fff;padding:19px 28px;border-radius:12px;font-size:29px;font-weight:850;box-shadow:0 15px 30px #1c2a3a33}.cover .swipe{position:absolute;left:88px;bottom:74px;font-size:23px;font-weight:800;color:var(--red)}.panel{margin-top:58px;display:grid;gap:20px}.row{display:grid;grid-template-columns:190px 1fr;align-items:center;min-height:132px;padding:24px 30px;border:2px solid #e7dfd3;background:#fff;border-radius:18px;box-shadow:0 14px 34px #1c2a3a12}.time{font-size:29px;font-weight:900;color:var(--red)}.desc{font-size:30px;font-weight:800}.desc small{display:block;font-size:22px;color:var(--muted);font-weight:600;margin-top:4px}.photo-title{margin-top:42px}.photos{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:410px 410px;gap:18px;margin-top:36px}.photo{position:relative;overflow:hidden;border-radius:22px;background:#ddd}.photo:first-child{grid-row:span 2}.photo img{width:100%;height:100%;object-fit:cover}.photo span{position:absolute;left:18px;bottom:18px;background:rgba(28,42,58,.9);color:#fff;border-radius:8px;padding:10px 15px;font-size:20px;font-weight:800}.checks{display:grid;gap:22px;margin-top:62px}.check{display:flex;gap:25px;align-items:flex-start;padding:30px;background:#fff;border:2px solid #e7dfd3;border-radius:18px}.icon{display:grid;place-items:center;flex:none;width:70px;height:70px;border-radius:50%;background:#f4eee4;font-size:35px}.check strong{font-size:31px}.check p{font-size:23px;line-height:1.5;margin:4px 0 0;color:var(--muted)}.alert{margin-top:28px;padding:25px 28px;border-left:8px solid var(--red);border-radius:12px;background:#fdefec;color:#7a2418;font-size:23px;font-weight:750}.last{background:var(--navy);color:#fff}.last .brand,.last .num{color:#fff}.last .eyebrow{color:var(--amber)}.last .title{font-size:86px}.last .lead{color:#dce3e9}.contact{margin-top:65px;background:#fff;color:var(--navy);border-radius:22px;padding:38px 42px;display:grid;gap:24px}.contact div{font-size:30px;font-weight:850}.contact span{display:block;font-size:19px;color:var(--red);letter-spacing:.08em;margin-bottom:3px}.location{position:absolute;left:88px;bottom:82px;color:#bfc8d2;font-size:21px}.dots{position:absolute;right:88px;bottom:76px;display:flex;gap:10px}.dots i{width:11px;height:11px;border-radius:50%;background:#5e6c7b}.dots i.on{width:34px;border-radius:8px;background:var(--amber)}
</style></head><body><main id="app"></main>
<script>
const slide=Number(new URLSearchParams(location.search).get('slide')||1);
const brand=`<div class="brand"><span class="mark">JC</span>정철 애프터스쿨</div><div class="num">${slide} / 5</div>`;
const dots=`<div class="dots">${[1,2,3,4,5].map(n=>`<i class="${n===slide?'on':''}"></i>`).join('')}</div>`;
const slides={
1:`<section class="slide cover">${brand}<div class="eyebrow">2026 SUMMER CAMP · SESSION 2</div><h1 class="title">여름캠프<br>2차 시작!</h1><p class="lead">배움도, 즐거움도 가득한<br>8월을 함께해요 ☀️</p><div class="date">8월 4일(화) — 8월 28일(금)</div><div class="swipe">준비물과 하루 일정 보기 →</div>${dots}</section>`,
2:`<section class="slide">${brand}<div class="eyebrow">DAILY SCHEDULE</div><h1 class="title">한눈에 보는<br>캠프 하루</h1><div class="panel"><div class="row"><div class="time">8:30–9:30</div><div class="desc">얼리 드롭오프<small>출석 체크와 등원 준비</small></div></div><div class="row"><div class="time">9:30–4:00</div><div class="desc">캠프 프로그램<small>수업 · 점심 · 자유활동 · 야외활동</small></div></div><div class="row"><div class="time">4:00–6:00</div><div class="desc">순차 하원 &amp; 돌봄</div></div><div class="row"><div class="time">6:00–7:00</div><div class="desc">무료 돌봄 서비스<small>맞벌이 부모님을 위한 연장 돌봄</small></div></div></div>${dots}</section>`,
3:`<section class="slide">${brand}<div class="eyebrow photo-title">LEARN · CREATE · PLAY</div><h1 class="title">배우고, 만들고,<br>함께 성장해요</h1><div class="photos"><div class="photo"><img src="../../web/blog/img/camp-wk5day5-0731-hero.jpg"><span>과학 · 관찰</span></div><div class="photo"><img src="../../web/blog/img/camp-wk5day4-0730-hero.jpg"><span>영어 · 인체 과학</span></div><div class="photo"><img src="../../web/blog/img/camp-wk4day3-0722-hero.jpg"><span>리서치 · 협업</span></div></div>${dots}</section>`,
4:`<section class="slide">${brand}<div class="eyebrow">FIRST-DAY CHECKLIST</div><h1 class="title">첫날 준비물,<br>잊지 마세요!</h1><div class="checks"><div class="check"><div class="icon">💧</div><div><strong>개인 물통 또는 물병</strong><p>하루 동안 사용할 물통을 보내 주세요.</p></div></div><div class="check"><div class="icon">🍴</div><div><strong>개인 식기도구</strong><p>수저 · 젓가락 · 포크를 챙겨 주세요.</p></div></div><div class="check"><div class="icon">🍪</div><div><strong>간식은 캠프에서 준비</strong><p>특별히 가리는 음식이 있다면 여분 간식도 좋아요.</p></div></div></div><div class="alert">알러지가 있는 학생은 반드시 미리 연락해 주세요.</div>${dots}</section>`,
5:`<section class="slide last">${brand}<div class="eyebrow">SEE YOU ON AUGUST 4</div><h1 class="title">2차 캠프에서<br>만나요! ☀️</h1><p class="lead">참가 상담이나 준비물 관련 질문은<br>전화 또는 카카오톡으로 편하게 문의해 주세요.</p><div class="contact"><div><span>PHONE</span>778-258-2223</div><div><span>INSTAGRAM</span>@jc_afterschool</div><div><span>WEBSITE</span>jcafterschool.ca</div></div><div class="location">#130 – 1140 Austin Ave, Coquitlam, BC</div>${dots}</section>`};
document.getElementById('app').innerHTML=slides[slide];
</script></body></html>
