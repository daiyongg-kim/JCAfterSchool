<script>
const slide=Number(new URLSearchParams(location.search).get('slide')||1);
const brand=`<div class="brand"><span class="mark">JC</span>정철 애프터스쿨</div><div class="num">${slide} / 5</div>`;
const dots=`<div class="dots">${[1,2,3,4,5].map(n=>`<i class="${n===slide?'on':''}"></i>`).join('')}</div>`;
const slides={
1:`<section class="slide cover">${brand}<div class="eyebrow">2026 SUMMER CAMP · SESSION 2</div><h1 class="title">여름캠프<br>2차 시작!</h1><p class="lead">배움도, 즐거움도 가득한<br>8월을 함께해요 ☀️</p><div class="date">8월 4일(화) — 8월 28일(금)</div><div class="swipe">준비물과 하루 일정 보기 →</div>${dots}</section>`,
2:`<section class="slide">${brand}<div class="eyebrow">DAILY SCHEDULE</div><h1 class="title">한눈에 보는<br>캠프 하루</h1><div class="panel"><div class="row"><div class="time">8:30–9:30</div><div class="desc">얼리 드롭오프<small>출석 체크와 등원 준비</small></div></div><div class="row"><div class="time">9:30–4:00</div><div class="desc">캠프 프로그램<small>수업 · 점심 · 자유활동 · 야외활동</small></div></div><div class="row"><div class="time">4:00–6:00</div><div class="desc">순차 하원 &amp; 돌봄</div></div><div class="row"><div class="time">6:00–7:00</div><div class="desc">무료 돌봄 서비스<small>맞벌이 부모님을 위한 연장 돌봄</small></div></div></div>${dots}</section>`,
3:`<section class="slide">${brand}<div class="eyebrow photo-title">LEARN · CREATE · PLAY</div><h1 class="title">배우고, 만들고,<br>함께 성장해요</h1><div class="photos"><div class="photo"><img src="../../web/blog/img/camp-wk5day5-0731-setup.jpg"><span>과학 · 관찰</span></div><div class="photo"><img src="../../web/blog/img/camp-wk5day4-0730-bones-sheets2.jpg"><span>영어 · 인체 과학</span></div><div class="photo"><img src="../../web/blog/img/camp-wk4day3-0722-golden-poster.jpg"><span>리서치 · 표현</span></div></div>${dots}</section>`,
4:`<section class="slide">${brand}<div class="eyebrow">FIRST-DAY CHECKLIST</div><h1 class="title">첫날 준비물,<br>잊지 마세요!</h1><div class="checks"><div class="check"><div class="icon">💧</div><div><strong>개인 물통 또는 물병</strong><p>하루 동안 사용할 물통을 보내 주세요.</p></div></div><div class="check"><div class="icon">🍴</div><div><strong>개인 식기도구</strong><p>수저 · 젓가락 · 포크를 챙겨 주세요.</p></div></div><div class="check"><div class="icon">🍪</div><div><strong>간식은 캠프에서 준비</strong><p>특별히 가리는 음식이 있다면 여분 간식도 좋아요.</p></div></div></div><div class="alert">알러지가 있는 학생은 반드시 미리 연락해 주세요.</div>${dots}</section>`,
5:`<section class="slide last">${brand}<div class="eyebrow">SEE YOU ON AUGUST 4</div><h1 class="title">2차 캠프에서<br>만나요! ☀️</h1><p class="lead">참가 상담이나 준비물 관련 질문은<br>전화 또는 카카오톡으로 편하게 문의해 주세요.</p><div class="contact"><div><span>PHONE</span>778-258-2223</div><div><span>INSTAGRAM</span>@jc_afterschool</div><div><span>WEBSITE</span>jcafterschool.ca</div></div><div class="location">#130 – 1140 Austin Ave, Coquitlam, BC</div>${dots}</section>`};
