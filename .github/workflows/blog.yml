name: Sync Naver Blog

on:
  schedule:
    - cron: '30 17 * * 1'   # 매주 월요일 1회 (UTC 17:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install --quiet Pillow
      - name: Fetch Naver blog → site
        run: python3 scripts/fetch-blog.py

      - name: Commit if blog changed
        run: |
          if git diff --quiet -- web/blog; then
            echo "블로그 변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/blog
            git commit -m "chore: 네이버 블로그 자동 동기화"
            git push
            echo "✅ 블로그 갱신·푸시 완료"
          fi
