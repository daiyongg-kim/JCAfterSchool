name: Update Google Reviews

on:
  schedule:
    - cron: '0 17 * * *'   # 매일 1회 (UTC 17:00 ≈ 밴쿠버 오전 9~10시)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 scripts/fetch-reviews.py

      - name: Commit if reviews changed
        run: |
          if git diff --quiet -- web/reviews.json; then
            echo "리뷰 변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/reviews.json
            git commit -m "chore: 구글 리뷰 자동 갱신"
            git push
            echo "✅ 리뷰 갱신·푸시 완료 (사이트 자동 재배포됨)"
          fi
